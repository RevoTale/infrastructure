when:
  - event: [pull_request, release]

matrix:
  include:
    - CONTEXT: devcontainer
      DESCRIPTION: RevoTale development environment with Biome
    - CONTEXT: imgproxy
      DESCRIPTION: RevoTale imgproxy runtime configuration
    - CONTEXT: nginx
      DESCRIPTION: RevoTale nginx edge proxy with generated routes

variables:
  - &image-settings
    context: ${CONTEXT}
    dockerfile: ${CONTEXT}/Dockerfile
    repo: ghcr.io/revotale/infrastructure-${CONTEXT}
    title: RevoTale infrastructure ${CONTEXT}
    description: ${DESCRIPTION}
    authors: Liakhovskyi Vladyslav
    licenses: UNLICENSED

steps:
  - name: build
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    when:
      - event: pull_request
    settings:
      <<: *image-settings
      dry_run: true

  - name: publish
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    when:
      - event: release
    settings:
      <<: *image-settings
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      provenance: mode=max
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
